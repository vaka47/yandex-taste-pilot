name: Sync Yandex Music history

on:
  schedule:
    # Offset from the start of the hour, when GitHub Actions is under the highest load.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taste-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger protected history sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          curl --fail-with-body --silent --show-error --retry 2 --max-time 180
          -H "Authorization: Bearer ${CRON_SECRET}"
          "${APP_URL}/api/cron/sync?source=github_schedule"
