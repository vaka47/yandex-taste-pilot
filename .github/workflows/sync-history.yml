name: Sync Yandex Music history

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taste-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger protected history sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl --fail-with-body --silent --show-error --retry 2 --max-time 180 -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/sync"
