name: Watch Yandex Music automation

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taste-history-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run an independent recovery cycle
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 180
          -H "Authorization: Bearer ${CRON_SECRET}"
          "${APP_URL}/api/cron/sync?source=github_watchdog"
