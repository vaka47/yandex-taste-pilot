x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-taste}
      POSTGRES_USER: ${POSTGRES_USER:-taste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 4s
      retries: 20
    mem_limit: 1g
    cpus: 0.75
    logging: *default-logging

  migrate:
    build:
      context: .
      target: migration
    restart: "no"
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  connector:
    build:
      context: music-connector
    restart: unless-stopped
    env_file: .env.production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 700m
    cpus: 0.75
    logging: *default-logging

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: https://nitca.ru
    restart: unless-stopped
    init: true
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      connector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 20s
    mem_limit: 1200m
    cpus: 1.25
    logging: *default-logging

  scheduler:
    image: alpine:3.22
    restart: unless-stopped
    init: true
    env_file: .env.production
    depends_on:
      web:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          wget -qO- --timeout=55 --header="Authorization: Bearer $${CRON_SECRET}" \
            "http://web:3000/api/cron/sync?source=vm_scheduler" >/dev/null || true
          sleep 60
        done
    mem_limit: 64m
    cpus: 0.10
    logging: *default-logging

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    init: true
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DATABASE:-taste}
      PGUSER: ${POSTGRES_USER:-taste}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - database-backups:/backups
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump --format=custom --compress=6 --file="/backups/taste-$${stamp}.dump.tmp"
          mv "/backups/taste-$${stamp}.dump.tmp" "/backups/taste-$${stamp}.dump"
          find /backups -type f -name 'taste-*.dump' -mtime +7 -delete
          sleep 86400
        done
    mem_limit: 160m
    cpus: 0.25
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 160m
    cpus: 0.25
    logging: *default-logging

volumes:
  postgres-data:
  database-backups:
  caddy-data:
  caddy-config:
